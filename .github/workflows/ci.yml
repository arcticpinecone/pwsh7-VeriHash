name: CI

on:
  push:
    branches: [dev, main]
    paths:
      - '**.ps1'
      - 'Tests/**'
      - 'PSScriptAnalyzerSettings.psd1'
      # Without this, a change to the workflow itself does not trigger it, so a
      # fix to CI could never be validated by pushing it.
      - '.github/workflows/**'
  pull_request:
    branches: [dev, main]
    paths:
      - '**.ps1'
      - 'Tests/**'
      - 'PSScriptAnalyzerSettings.psd1'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Pester
        run: |
          # Tracks the major version the project actually develops against.
          # This was pinned to <=5.99 while local runs and Test-All.ps1 used
          # Pester 6, so CI was exercising a different runner than every
          # developer -- a green CI could not be taken as evidence about the
          # suite people actually run, in either direction.
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 6.0 -MaximumVersion 6.99

      - name: Run Pester Tests
        run: |
          # Add repo root to PSModulePath so Test-ModuleManifest can resolve RequiredModules
          $env:PSModulePath = "$PWD$([IO.Path]::PathSeparator)$env:PSModulePath"
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        run: |
          $files = @(
              './VeriHash.ps1',
              './VeriHash.Integrations.ps1'
          )
          $modules = @('VeriHash.Core', 'VeriHash.HotPath', 'VeriHash.Manifest')
          foreach ($mod in $modules) {
              $files += Get-ChildItem -Path "./$mod" -Recurse -Filter '*.ps1' |
                  Select-Object -ExpandProperty FullName
          }
          $settings = './PSScriptAnalyzerSettings.psd1'
          $totalIssues = 0

          foreach ($file in $files) {
              $results = Invoke-ScriptAnalyzer -Path $file -Settings $settings
              if ($results) {
                  $totalIssues += $results.Count
                  Write-Host "❌ $file - $($results.Count) issue(s):" -ForegroundColor Red
                  $results | Format-Table RuleName, Severity, Line, Message -AutoSize
              } else {
                  Write-Host "✅ $file - Clean" -ForegroundColor Green
              }
          }

          if ($totalIssues -gt 0) {
              Write-Error "PSScriptAnalyzer found $totalIssues total issue(s)"
              exit 1
          }

          Write-Host "`n✅ All files pass PSScriptAnalyzer" -ForegroundColor Green
